<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 13 Prep — CogAT Learning Path</title>
<style>
  :root{
    --ink:#1D2B3A; --paper:#FBF8F2; --line:#D9D2C2; --forest:#3B6E5E;
    --clay:#A6432E; --gold:#C98A2C; --muted:#6B6458; --white:#FFFFFF;
    --wrong:#A6432E; --right:#3B6E5E; --sky:#4A6FA5; --plum:#7A4E9E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;}
  h1,h2,h3{font-family:Georgia,"Source Serif Pro",serif;font-weight:600;margin:0 0 .3em;}
  .shell{max-width:820px;margin:0 auto;padding:0 20px 80px;}
  header.top{border-bottom:2px solid var(--ink);padding:18px 0 14px;margin-bottom:22px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header.top .brand{display:flex;flex-direction:column;}
  header.top h1{font-size:1.35rem;letter-spacing:.2px;}
  header.top .tag{color:var(--muted);font-size:.8rem;}
  header.top .whoami{display:flex;align-items:center;gap:8px;font-size:.85rem;}
  header.top .whoami .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:1rem;background:#EFE9DA;}
  header.top .whoami a{color:var(--forest);cursor:pointer;text-decoration:none;font-size:.78rem;}
  nav.modeswitch{display:flex;gap:0;border:1px solid var(--ink);border-radius:3px;overflow:hidden;}
  nav.modeswitch button{background:var(--white);border:none;padding:7px 12px;font-size:.8rem;
    cursor:pointer;color:var(--ink);border-right:1px solid var(--ink);}
  nav.modeswitch button:last-child{border-right:none;}
  nav.modeswitch button.active{background:var(--ink);color:var(--white);}
  .subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .subnav button{background:var(--white);border:1px solid var(--line);padding:7px 13px;
    border-radius:20px;font-size:.8rem;cursor:pointer;color:var(--ink);}
  .subnav button.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .crumb{color:var(--muted);font-size:.8rem;margin-bottom:6px;}
  .crumb a{color:var(--forest);cursor:pointer;text-decoration:none;}
  .crumb a:hover{text-decoration:underline;}
  .panel{border-bottom:1px solid var(--line);padding:18px 0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr;}}
  @media(max-width:420px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}
  .choice{border:1px solid var(--ink);background:var(--white);padding:16px;cursor:pointer;
    border-radius:2px;text-align:left;}
  .choice:hover{background:#F1ECE0;}
  .choice h3{margin:0 0 4px;font-size:1.02rem;}
  .choice p{margin:0;color:var(--muted);font-size:.82rem;}
  .btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--white);
    padding:10px 18px;font-size:.88rem;cursor:pointer;border-radius:2px;font-family:inherit;}
  .btn.secondary{background:var(--white);color:var(--ink);}
  .btn.forest{background:var(--forest);border-color:var(--forest);}
  .btn.clay{background:var(--clay);border-color:var(--clay);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btnbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .qcard{padding:16px 0;border-bottom:1px solid var(--line);}
  .qcard .qnum{color:var(--gold);font-weight:700;font-size:.8rem;letter-spacing:.5px;}
  .qcard .qtext{font-size:1rem;margin:6px 0 10px;}
  .opts{display:flex;flex-direction:column;gap:6px;}
  .opt{border:1px solid var(--line);padding:9px 12px;border-radius:2px;cursor:pointer;font-size:.92rem;}
  .opt:hover{border-color:var(--ink);}
  .opt.selected{border-color:var(--ink);background:#EFE9DA;font-weight:600;}
  .opt.correct{border-color:var(--right);background:#E4EFEA;}
  .opt.incorrect{border-color:var(--wrong);background:#F4E4E0;}
  input.numin{border:1px solid var(--line);padding:9px 12px;border-radius:2px;font-size:.95rem;width:140px;}
  .explbtn{margin-top:8px;background:none;border:none;color:var(--forest);cursor:pointer;
    font-size:.82rem;padding:0;text-decoration:underline;}
  .expl{margin-top:8px;background:#F1ECE0;border-left:3px solid var(--gold);padding:8px 12px;
    font-size:.85rem;color:var(--ink);display:none;}
  .expl.show{display:block;}
  .status{font-size:.78rem;font-weight:700;letter-spacing:.4px;margin-left:8px;}
  .status.correct{color:var(--right);} .status.incorrect{color:var(--wrong);}
  .timerbar{position:sticky;top:0;background:var(--ink);color:var(--white);padding:10px 16px;
    display:flex;justify-content:space-between;align-items:center;z-index:5;border-radius:2px;
    margin-bottom:16px;}
  .timerbar .time{font-family:Georgia,serif;font-size:1.3rem;font-variant-numeric:tabular-nums;}
  .timerbar.low{background:var(--clay);}
  .scorebox{border:1px solid var(--ink);padding:18px;margin-bottom:18px;}
  .scorebox .big{font-size:2.2rem;font-family:Georgia,serif;}
  .barrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:.88rem;}
  .barrow .lbl{width:130px;color:var(--muted);flex-shrink:0;}
  .barrow .track{flex:1;height:8px;background:#EAE3D3;border-radius:4px;overflow:hidden;}
  .barrow .fill{height:100%;background:var(--forest);}
  .pingate{max-width:340px;margin:60px auto;text-align:center;}
  .pingate input{font-size:1.6rem;letter-spacing:6px;text-align:center;width:100%;padding:12px;
    border:1px solid var(--ink);border-radius:3px;margin:14px 0;}
  .lockrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
    border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .lockrow .name{font-weight:600;}
  .lockrow .meta{color:var(--muted);font-size:.8rem;}
  .mininput{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:2px;font-size:.9rem;}
  .note{color:var(--muted);font-size:.82rem;font-style:italic;}
  table.hist{width:100%;border-collapse:collapse;font-size:.85rem;}
  table.hist th,table.hist td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);}
  .warn{background:#F4E4E0;border:1px solid var(--clay);padding:10px 14px;border-radius:2px;
    font-size:.85rem;margin-top:10px;}
  .roster-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px;}
  @media(max-width:560px){.roster-grid{grid-template-columns:repeat(2,1fr);}}
  .roster-card{border:1px solid var(--ink);background:var(--white);padding:18px 10px;text-align:center;
    cursor:pointer;border-radius:4px;}
  .roster-card:hover{background:#F1ECE0;}
  .roster-card .av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:1.7rem;margin:0 auto 8px;}
  .roster-card .nm{font-weight:600;}
  .roster-card .sub{color:var(--muted);font-size:.75rem;margin-top:2px;}
  .avatarpick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
  .avatarpick .em{width:42px;height:42px;border-radius:50%;background:#EFE9DA;display:flex;
    align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;border:2px solid transparent;}
  .avatarpick .em.sel{border-color:var(--ink);}
  .nameinput{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;font-size:1rem;
    margin-bottom:8px;}
  .ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;}
  .ring .inner{width:74px;height:74px;background:var(--paper);border-radius:50%;display:flex;
    flex-direction:column;align-items:center;justify-content:center;}
  .ring .inner b{font-size:1.2rem;font-family:Georgia,serif;}
  .ring .inner span{font-size:.65rem;color:var(--muted);}
  .dash-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .streakpill{background:var(--gold);color:var(--white);padding:5px 12px;border-radius:14px;
    font-size:.8rem;font-weight:600;display:inline-block;}
  .cta{border:2px solid var(--ink);padding:16px;border-radius:3px;background:#F1ECE0;margin-top:14px;}
  .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .badge-chip{border:1px solid var(--line);padding:6px 12px;border-radius:14px;font-size:.78rem;}
  .badge-chip.earned{border-color:var(--gold);background:#FBF1DD;font-weight:600;}
  .badge-chip.locked{color:var(--muted);}
  .week-block{border:1px solid var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden;}
  .week-head{background:#EFE9DA;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;
    align-items:center;font-weight:600;font-size:.92rem;}
  .week-head .wk-meta{font-weight:400;color:var(--muted);font-size:.78rem;}
  .day-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
    border-top:1px solid var(--line);font-size:.88rem;}
  .day-row .dlbl{color:var(--muted);width:90px;flex-shrink:0;}
  .day-row .dstatus{font-size:1rem;}
  .day-row.done{color:var(--muted);}
  .day-row .dstatus.done{color:var(--forest);}
  .day-row .dstatus.locked{color:var(--muted);}
  table.lb{width:100%;border-collapse:collapse;font-size:.88rem;}
  table.lb th,table.lb td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
  table.lb .av-sm{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;
    justify-content:center;font-size:.9rem;background:#EFE9DA;margin-right:6px;vertical-align:middle;}
  .modal-overlay{position:fixed;inset:0;background:rgba(29,43,58,.55);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:20px;}
  .modal-box{background:var(--white);border:1px solid var(--ink);border-radius:4px;padding:22px;
    max-width:380px;width:100%;}
  .modal-box p{margin:0 0 12px;}
</style>
</head>

<script>
const DRILLS = {"verbal": {"1": {"SC": [{"q": "Despite the heavy rain, the players were ___ to finish the game.", "o": ["reluctant", "determined", "confused", "tired"], "a": 1, "e": "Determined fits: they push through despite the rain."}, {"q": "The museum's newest exhibit was so ___ that visitors waited in line for hours.", "o": ["popular", "empty", "forgotten", "quiet"], "a": 0, "e": "Long lines mean it was popular."}, {"q": "Because she had studied all week, Maria felt completely ___ for the exam.", "o": ["nervous", "prepared", "surprised", "late"], "a": 1, "e": "Studying all week leads to feeling prepared."}, {"q": "After the inspection revealed cracks in its foundation, the old bridge was declared ___.", "o": ["safe", "beautiful", "unsafe", "new"], "a": 2, "e": "Cracks in the foundation lead to it being declared unsafe."}, {"q": "The scientist's hypothesis was ___ by three separate experiments that all produced the same result.", "o": ["confirmed", "ignored", "forgotten", "questioned"], "a": 0, "e": "Getting the same result three times means it was confirmed."}, {"q": "Even though the hikers were exhausted, they refused to ___ before reaching the summit.", "o": ["celebrate", "quit", "eat", "rest"], "a": 1, "e": "\"Even though exhausted... refused to\" signals persistence — they refused to quit."}, {"q": "The librarian asked everyone to stay ___ so other visitors could concentrate.", "o": ["loud", "quiet", "cheerful", "busy"], "a": 1, "e": "A library calls for quiet."}, {"q": "The weather turned ___ , so the picnic was moved indoors.", "o": ["sunny", "stormy", "warm", "calm"], "a": 1, "e": "Moving indoors implies bad, stormy weather."}, {"q": "The coach was ___ with the team after their hard-fought win.", "o": ["disappointed", "proud", "angry", "bored"], "a": 1, "e": "A hard-fought win makes a coach proud."}, {"q": "Because the milk had gone bad, it smelled ___ .", "o": ["sweet", "sour", "fresh", "plain"], "a": 1, "e": "Spoiled milk smells sour."}, {"q": "The new student felt ___ on her first day at a school where she knew no one.", "o": ["confident", "nervous", "thrilled", "tired"], "a": 1, "e": "Knowing no one on the first day causes nervousness."}, {"q": "The firefighter was praised as a ___ for rescuing the family from the fire.", "o": ["stranger", "hero", "visitor", "teacher"], "a": 1, "e": "Rescuing people makes someone a hero."}, {"q": "The birthday cake was decorated with such ___ that everyone wanted a photo before eating it.", "o": ["care", "neglect", "haste", "indifference"], "a": 0, "e": "Wanting photos suggests the cake was made with care."}, {"q": "After running the marathon, his legs felt ___ and sore.", "o": ["energetic", "heavy", "light", "strong"], "a": 1, "e": "Soreness after a marathon makes legs feel heavy."}, {"q": "The kitten was so ___ that it slept for most of the day.", "o": ["playful", "lazy", "curious", "noisy"], "a": 1, "e": "Sleeping most of the day describes laziness."}, {"q": "The teacher gave the class a ___ round of applause for their hard work.", "o": ["quiet", "hearty", "brief", "silent"], "a": 1, "e": "Hard work earns a hearty, enthusiastic round of applause."}, {"q": "Since the store was ___ , we found a parking spot right away.", "o": ["crowded", "empty", "closed", "busy"], "a": 1, "e": "Finding parking right away implies the store was empty."}, {"q": "The magician's trick left the audience completely ___ .", "o": ["bored", "amazed", "annoyed", "tired"], "a": 1, "e": "A magic trick amazes an audience."}, {"q": "The ___ smell of fresh bread filled the kitchen.", "o": ["foul", "delicious", "sharp", "faint"], "a": 1, "e": "Fresh bread has a delicious smell."}, {"q": "Because the trail was so ___ , hikers needed sturdy boots and walking sticks.", "o": ["flat", "rugged", "short", "paved"], "a": 1, "e": "Needing sturdy boots and sticks implies a rugged trail."}], "VC": [{"q": "Apple, Banana, Orange — which word belongs?", "o": ["Carrot", "Grape", "Chicken", "Table"], "a": 1, "e": "All are fruits; grape is the only fruit option."}, {"q": "Hammer, Screwdriver, Wrench — which belongs?", "o": ["Nail", "Pliers", "Wood", "Paint"], "a": 1, "e": "All are hand tools; pliers is a tool too."}, {"q": "Red, Blue, Green — which belongs?", "o": ["Circle", "Yellow", "Square", "Big"], "a": 1, "e": "All are colors; yellow is the only color option."}, {"q": "Dog, Cat, Horse — which belongs?", "o": ["Rock", "Rabbit", "Car", "Chair"], "a": 1, "e": "All are animals; rabbit is the only animal option."}, {"q": "Run, Jump, Swim — which belongs?", "o": ["Table", "Climb", "Happy", "Blue"], "a": 1, "e": "All are physical actions; climb is an action too."}, {"q": "January, March, July — which belongs?", "o": ["Monday", "October", "Spring", "Noon"], "a": 1, "e": "All are months; October is the only month option."}, {"q": "Piano, Guitar, Violin — which belongs?", "o": ["Drum", "Chair", "Cloud", "Shoe"], "a": 0, "e": "All are musical instruments; drum is one too."}, {"q": "Lion, Tiger, Bear — which belongs?", "o": ["Wolf", "Table", "Pencil", "River"], "a": 0, "e": "All are wild animals; wolf is one too."}, {"q": "Happy, Sad, Angry — which belongs?", "o": ["Excited", "Green", "Fast", "Round"], "a": 0, "e": "All are emotions; excited is one too."}, {"q": "Doctor, Nurse, Surgeon — which belongs?", "o": ["Paramedic", "Chair", "Window", "Bicycle"], "a": 0, "e": "All work in healthcare; paramedic is one too."}, {"q": "Baseball, Soccer, Basketball — which belongs?", "o": ["Tennis", "Book", "Lamp", "Cloud"], "a": 0, "e": "All are sports; tennis is one too."}, {"q": "Rose, Tulip, Daisy — which belongs?", "o": ["Sunflower", "Rock", "Spoon", "Cloud"], "a": 0, "e": "All are flowers; sunflower is one too."}, {"q": "Notebook, Pencil, Eraser — which belongs?", "o": ["Ruler", "Cloud", "Chair", "River"], "a": 0, "e": "All are school supplies; ruler is one too."}, {"q": "Ocean, Lake, River — which belongs?", "o": ["Pond", "Mountain", "Desert", "Cloud"], "a": 0, "e": "All are bodies of water; pond is one too."}, {"q": "Carpenter, Electrician, Plumber — which belongs?", "o": ["Mechanic", "Book", "Chair", "Window"], "a": 0, "e": "All are skilled trades; mechanic is one too."}, {"q": "Whisper, Shout, Sing — which belongs?", "o": ["Speak", "Color", "Table", "Fast"], "a": 0, "e": "All are ways of using your voice; speak fits."}, {"q": "Sparrow, Eagle, Robin — which belongs?", "o": ["Owl", "Fish", "Snake", "Frog"], "a": 0, "e": "All are birds; owl is one too."}, {"q": "Triangle, Square, Circle — which belongs?", "o": ["Pentagon", "Music", "Happy", "Slow"], "a": 0, "e": "All are shapes; pentagon is one too."}, {"q": "Grape, Cherry, Strawberry — which belongs?", "o": ["Blueberry", "Carrot", "Potato", "Onion"], "a": 0, "e": "All are fruits; blueberry is one too."}, {"q": "Snow, Rain, Hail — which belongs?", "o": ["Sleet", "Sunshine", "Wind", "Fog"], "a": 0, "e": "All are forms of precipitation; sleet is one too."}], "VA": [{"q": "Bird is to Nest as Dog is to ___?", "o": ["Bone", "Kennel", "Bark", "Tail"], "a": 1, "e": "An animal's home: nest is to bird as kennel is to dog."}, {"q": "Hot is to Cold as Up is to ___?", "o": ["Down", "Sky", "High", "Over"], "a": 0, "e": "Opposites: hot/cold pairs with up/down."}, {"q": "Pen is to Write as Knife is to ___?", "o": ["Sharp", "Cut", "Kitchen", "Metal"], "a": 1, "e": "Tool to its function: pen writes, knife cuts."}, {"q": "Puppy is to Dog as Kitten is to ___?", "o": ["Cat", "Milk", "Small", "Pet"], "a": 0, "e": "Baby animal to adult: puppy grows into dog, kitten grows into cat."}, {"q": "Author is to Book as Painter is to ___?", "o": ["Brush", "Painting", "Museum", "Color"], "a": 1, "e": "Creator to their work: author writes a book, painter makes a painting."}, {"q": "Fish is to Water as Bird is to ___?", "o": ["Nest", "Air", "Feather", "Tree"], "a": 1, "e": "Habitat/element: fish lives in water, bird lives in air."}, {"q": "Clock is to Time as Ruler is to ___?", "o": ["Wood", "Length", "School", "Draw"], "a": 1, "e": "Tool to what it measures: clock measures time, ruler measures length."}, {"q": "Umbrella is to Rain as Coat is to ___?", "o": ["Cold", "Closet", "Button", "Sleeve"], "a": 0, "e": "Item to what it protects against: umbrella against rain, coat against cold."}, {"q": "Farmer is to Field as Teacher is to ___?", "o": ["Classroom", "Book", "Student", "Chalk"], "a": 0, "e": "Worker to their workplace: farmer works a field, teacher works a classroom."}, {"q": "Ice is to Cold as Fire is to ___?", "o": ["Hot", "Smoke", "Wood", "Light"], "a": 0, "e": "Element to its property: ice is cold, fire is hot."}, {"q": "Whale is to Ocean as Lion is to ___?", "o": ["Cage", "Savanna", "Zoo", "Forest"], "a": 1, "e": "Animal to its natural habitat: whale in ocean, lion on savanna."}, {"q": "Glove is to Hand as Sock is to ___?", "o": ["Shoe", "Foot", "Cotton", "Leg"], "a": 1, "e": "Item to the body part it covers: glove covers hand, sock covers foot."}, {"q": "Teacher is to Lesson as Chef is to ___?", "o": ["Kitchen", "Recipe", "Restaurant", "Apron"], "a": 1, "e": "Professional to what they prepare: teacher prepares a lesson, chef prepares a recipe."}, {"q": "Bee is to Hive as Ant is to ___?", "o": ["Colony", "Garden", "Anthill", "Queen"], "a": 2, "e": "Animal to its home: bee lives in a hive, ant lives in an anthill."}, {"q": "Book is to Chapter as Song is to ___?", "o": ["Radio", "Verse", "Album", "Singer"], "a": 1, "e": "Whole to a part of it: book has chapters, song has verses."}, {"q": "Sun is to Day as Moon is to ___?", "o": ["Star", "Night", "Sky", "Light"], "a": 1, "e": "Object to when it's visible: sun is seen by day, moon by night."}, {"q": "Water is to Drink as Bread is to ___?", "o": ["Bake", "Eat", "Wheat", "Oven"], "a": 1, "e": "Item to how it's used: water is for drinking, bread is for eating."}, {"q": "Scissors is to Cut as Needle is to ___?", "o": ["Thread", "Sew", "Cloth", "Sharp"], "a": 1, "e": "Tool to its function: scissors cut, needle sews."}, {"q": "Bicycle is to Pedal as Car i /* =========================================================
   STORAGE — shared across everyone who opens this app.
   Falls back to this browser only if cloud storage isn't available.
   ========================================================= */
const STORAGE_KEY="cogat_app_v2";
const hasCloud = (typeof window!=="undefined" && typeof window.storage!=="undefined");

function defaultApp(){ return {pin:"1234", students:{}}; }

async function loadApp(){
  try{
    if(hasCloud){
      const res = await window.storage.get(STORAGE_KEY, true);
      return res && res.value ? JSON.parse(res.value) : defaultApp();
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : defaultApp();
    }
  }catch(e){ return defaultApp(); }
}
function saveApp(){
  try{
    if(hasCloud){ window.storage.set(STORAGE_KEY, JSON.stringify(APP), true); }
    else{ localStorage.setItem(STORAGE_KEY, JSON.stringify(APP)); }
  }catch(e){ console.error("save failed", e); }
}

/* =========================================================
   IN-APP MODAL — replaces native alert()/confirm()/prompt().
   Native dialogs get silently blocked inside a sandboxed preview
   iframe (they throw instead of showing), which is why plain
   confirm()/alert() calls can make buttons look like they "do
   nothing." This modal never depends on the browser dialog APIs.
   ========================================================= */
let MODAL = null;
function showAlert(message){ MODAL={mode:"alert", message}; render(); }
function showConfirm(message, onYes){ MODAL={mode:"confirm", message, onYes}; render(); }
function showPrompt(message, onSubmit, defaultValue){ MODAL={mode:"prompt", message, onSubmit, value:defaultValue||""}; render(); }
function closeModal(){ MODAL=null; render(); }
function modalConfirmYes(){ const fn=MODAL&&MODAL.onYes; MODAL=null; if(fn) fn(); else render(); }
function modalSubmitPrompt(){
  const val=document.getElementById("modalInput").value;
  const fn=MODAL&&MODAL.onSubmit; MODAL=null;
  if(fn) fn(val); else render();
}
function modalHTML(){
  if(!MODAL) return "";
  let inner = `<div class="modal-overlay"><div class="modal-box"><p>${MODAL.message}</p>`;
  if(MODAL.mode==="alert"){
    inner += `<div class="btnbar"><button class="btn forest" onclick="closeModal()">OK</button></div>`;
  } else if(MODAL.mode==="confirm"){
    inner += `<div class="btnbar"><button class="btn clay" onclick="modalConfirmYes()">Yes, continue</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;
  } else if(MODAL.mode==="prompt"){
    inner += `<input class="nameinput" id="modalInput" value="${MODAL.value}" autofocus>
      <div class="btnbar"><button class="btn forest" onclick="modalSubmitPrompt()">Save</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;
  }
  inner += `</div></div>`;
  return inner;
}

function newStudentId(){ return "s"+Date.now()+Math.floor(Math.random()*999); }

function addStudent(name, avatar){
  const id = newStudentId();
  const idx = Object.keys(APP.students).length;
  APP.students[id] = {
    id, name:name.trim(), avatar: avatar||AVATARS[idx%AVATARS.length],
    color: COLORS[idx%COLORS.length], createdAt:new Date().toISOString(),
    history:[], streak:{current:0,longest:0,lastDate:null}, badgesSeen:[]
  };
  saveApp();
  return id;
}
function removeStudent(id){
  delete APP.students[id];
  if(CUR===id) CUR=null;
  saveApp();
}

function updateStreak(student){
  const today = new Date().toDateString();
  if(student.streak.lastDate===today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  if(student.streak.lastDate===y.toDateString()) student.streak.current++;
  else student.streak.current=1;
  student.streak.lastDate=today;
  student.streak.longest=Math.max(student.streak.longest||0, student.streak.current);
}

function batteryAccuracy(student){
  const acc={verbal:{c:0,n:0},quant:{c:0,n:0},nonverbal:{c:0,n:0}};
  student.history.forEach(h=>{
    if(!h.bySub) return;
    Object.keys(h.bySub).forEach(sub=>{
      const b=SUB_TO_BATTERY[sub]; if(!b) return;
      acc[b].c+=h.bySub[sub].c; acc[b].n+=h.bySub[sub].n;
    });
  });
  return acc;
}
function weakestBattery(student){
  const acc=batteryAccuracy(student);
  let worst="verbal", worstPct=2;
  ["verbal","quant","nonverbal"].forEach(b=>{
    if(acc[b].n>0){ const p=acc[b].c/acc[b].n; if(p<worstPct){worstPct=p; worst=b;} }
  });
  return worst;
}
function programDoneKeys(student){
  return new Set(student.history.map(h=>h.weekKey).filter(Boolean));
}
function programCompletionCount(student){ return programDoneKeys(student).size; }
function nextLesson(student){
  const done = programDoneKeys(student);
  for(let w=1; w<=10; w++){
    for(const d of DAYS){ if(!done.has("w"+w+"-"+d)) return {week:w, day:d}; }
  }
  return null;
}
function computeBadges(student){
  const acc=batteryAccuracy(student);
  const completion=programCompletionCount(student);
  const ace=(b)=> acc[b].n>=3 && (acc[b].c/acc[b].n)>=0.85;
  return [
    {id:"first",label:"First Steps",earned:student.history.length>0},
    {id:"streak3",label:"3-Day Streak",earned:(student.streak.longest||0)>=3},
    {id:"streak7",label:"7-Day Streak",earned:(student.streak.longest||0)>=7},
    {id:"streak14",label:"14-Day Streak",earned:(student.streak.longest||0)>=14},
    {id:"half",label:"Halfway There",earned:completion>=35},
    {id:"ready",label:"Test Ready",earned:completion>=70},
    {id:"mock",label:"Mock Milestone",earned:student.history.some(h=>h.kind==="mock")},
    {id:"verbal_ace",label:"Verbal Ace",earned:ace("verbal")},
    {id:"quant_ace",label:"Quant Ace",earned:ace("quant")},
    {id:"spatial_ace",label:"Spatial Ace",earned:ace("nonverbal")}
  ];
}

function weekPlan(weekNum, student){
  const tier=WEEK_TIER[weekNum];
  const weak=weakestBattery(student);
  const plan={};
  plan.mon={label:"Verbal drills (30 questions)",type:"battery",battery:"verbal",tier};
  plan.tue={label:"Quantitative drills (30 questions)",type:"battery",battery:"quant",tier};
  plan.wed={label:"Nonverbal drills (30 questions)",type:"battery",battery:"nonverbal",tier};
  plan.thu={label:"Focus: "+BLABEL[weak]+" — your weakest so far (30 questions)",type:"battery",battery:weak,tier};
  plan.fri={label:"Speed round — all 3 batteries mixed (27 questions)",type:"mixed",tier};
  if(MOCK_WEEKS[weekNum]) plan.sat={label:"Mock Test "+MOCK_WEEKS[weekNum]+" (parent-run, timed, 45 questions)",type:"mock",mockId:MOCK_WEEKS[weekNum]};
  else plan.sat={label:"Bonus practice — all 3 batteries mixed (27 questions)",type:"mixed",tier};
  plan.sun={label:"Review your missed questions",type:"review"};
  return plan;
}
function collectWeekMistakes(weekNum, student){
  const prefix="w"+weekNum+"-";
  let out=[]; const seen=new Set();
  student.history.forEach(h=>{
    if(h.weekKey && h.weekKey.indexOf(prefix)===0 && h.wrongQuestions){
      h.wrongQuestions.forEach(w=>{ if(!seen.has(w.q)){ seen.add(w.q); out.push({q:w.q,o:w.o,a:w.a,e:w.e}); } });
    }
  });
  return out;
}

/* =========================================================
   QUESTION SAMPLING (random, from the shared pool) + RUNNER
   ========================================================= */
function tagList(list,subKey){ return list.map(x=>({...x,_sub:subKey})); }
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sampleQuestions(b,t,sub,n){
  const pool = DRILLS[b][t][sub];
  return tagList(shuffle(pool).slice(0, Math.min(n, pool.length)), sub);
}
// collectQuestions: sub==="ALL" pulls n per subtest across the whole battery.
function collectQuestions(b,t,sub,n){
  n = n || PRACTICE_PER_SUB;
  if(sub==="ALL"){ let out=[]; BSUB[b].forEach(s=>{ out=out.concat(sampleQuestions(b,t,s,n)); }); return out; }
  return sampleQuestions(b,t,sub,n);
}
function collectMixedSpeed(tier){
  let out=[];
  ["verbal","quant","nonverbal"].forEach(b=>{ BSUB[b].forEach(s=>{ out=out.concat(sampleQuestions(b,tier,s,SPEED_PER_SUB)); }); });
  return shuffle(out);
}
function collectMock(tier){
  let out=[];
  ["verbal","quant","nonverbal"].forEach(b=>{ BSUB[b].forEach(s=>{ out=out.concat(sampleQuestions(b,tier,s,MOCK_PER_SUB)); }); });
  return shuffle(out);
}
function fmtTime(sec){ sec=Math.max(0,sec); const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }

function startRunner(title, questions, opts){
  opts=opts||{};
  S.runner={ title, questions, answers:new Array(questions.length).fill(null),
    timed:!!opts.timerSec, remaining:opts.timerSec||0,
    isMock:!!opts.isMock, weekKey:opts.weekKey||null, kind:opts.kind||(opts.isMock?"mock":(opts.weekKey?"program":"practice")),
    timerHandle:null };
  S.view="runner"; render();
  if(S.runner.timed){
    S.runner.timerHandle=setInterval(()=>{
      S.runner.remaining--; updateTimerDisplay();
      if(S.runner.remaining<=0){ clearInterval(S.runner.timerHandle); submitRunner(true); }
    },1000);
  }
}
function updateTimerDisplay(){
  const el=document.getElementById("timeval"), bar=document.getElementById("timerbar");
  if(!el||!bar) return;
  el.textContent=fmtTime(S.runner.remaining);
  if(S.runner.remaining<=120) bar.classList.add("low"); else bar.classList.remove("low");
}
function selectAnswer(i,val){ S.runner.answers[i]=val; render(); }

function submitRunner(auto){
  const unanswered=S.runner.answers.filter(a=>a===null||a==="").length;
  if(!auto && unanswered>0 && !S.runner._confirmedIncomplete){
    showConfirm(unanswered+" question(s) unanswered. Submit anyway?", ()=>{
      S.runner._confirmedIncomplete=true; submitRunner(false);
    });
    return;
  }
  if(S.runner.timerHandle) clearInterval(S.runner.timerHandle);
  let correct=0; const bySub={}; const wrongQuestions=[];
  S.runner.questions.forEach((q,i)=>{
    const key=q._sub||"—"; bySub[key]=bySub[key]||{c:0,n:0}; bySub[key].n++;
    let ok = q.o ? (S.runner.answers[i]===q.a) : ((S.runner.answers[i]||"").toString().trim()===q.a.toString().trim());
    if(ok){ correct++; bySub[key].c++; }
    else{ wrongQuestions.push({q:q.q,o:q.o,a:q.a,e:q.e,your:S.runner.answers[i]}); }
  });
  S.runner.score={correct,total:S.runner.questions.length,bySub};
  const student=currentStudent();
  if(student){
    student.history.unshift({date:new Date().toISOString(), title:S.runner.title, kind:S.runner.kind,
      weekKey:S.runner.weekKey, correct, total:S.runner.questions.length, bySub, wrongQuestions});
    updateStreak(student);
    saveApp();
  }
  S.view="results"; render();
}

    html += `<div class="week-block">

    }
    html += `</div>`;
  }

function toggleWeek(w){ S.openWeek = (S.openWeek===w) ? null : w; render(); }

function launchProgramDay(weekNum, day){
  const st=currentStudent();
  const plan=weekPlan(weekNum, st);
  const d=plan[day];
  const weekKey="w"+weekNum+"-"+day;
  if(d.type==="mock"){ showAlert("Mock tests are started by a parent. Switch to Parent mode → Mock tests."); return; }
  if(d.type==="review"){
    const wrongs=collectWeekMistakes(weekNum, st);
    if(wrongs.length===0){
      st.history.unshift({date:new Date().toISOString(), title:"Week "+weekNum+" review", kind:"review",
        weekKey, correct:1, total:1, bySub:{}, wrongQuestions:[]});
      updateStreak(st); saveApp();
      showAlert("Nothing to review this week — nice work! Marked complete.");
      return;
    }
    startRunner("Week "+weekNum+" review — missed questions", wrongs, {weekKey});
    return;
  }
  let qs;
  if(d.type==="battery") qs=collectQuestions(d.battery, d.tier, "ALL", PRACTICE_PER_SUB);
  else qs=collectMixedSpeed(d.tier);
  startRunner("Week "+weekNum+" · "+DAY_LABELS[day]+" — "+d.label, qs, {weekKey});
}

  else html += `<div class="crumb">${r.title}</div>`;
  html += `<div class="panel"><p class="note">Answer every question, then submit. You won't see whether you're right until you submit.</p></div>`;
  r.questions.forEach((q,i)=>{
    html += `<div class="qcard"><div class="qnum">QUESTION ${i+1} of ${r.questions.length}</div><div class="qtext">${q.q}</div>`;
    if(q.o){
      html += `<div class="opts">`;
      q.o.forEach((opt,oi)=>{ html += `<div class="opt ${r.answers[i]===oi?'selected':''}" onclick="selectAnswer(${i},${oi})">${opt}</div>`; });
      html += `</div>`;
    } else {
      html += `<input class="numin" type="text" placeholder="Your answer" value="${r.answers[i]||''}" oninput="selectAnswer(${i}, this.value)">`;
    }
    html += `</div>`;
  });
  html += `<div class="btnbar"><button class="btn forest" onclick="submitRunner(false)">Submit</button>
    <button class="btn secondary" onclick="cancelRunner()">Cancel</button></div>`;
  return html;
}
function cancelRunner(){
  if(S.runner.timerHandle) clearInterval(S.runner.timerHandle);
  S.runner=null; S.view = S.mode==="parent" ? "parent-home" : "dashboard"; render();
}

/* ---------- RESULTS ---------- */
function resultsHTML(){
  const r=S.runner; const pct=Math.round(100*r.score.correct/r.score.total);
  let html = `<div class="crumb">Results</div>
  <div class="scorebox"><div class="note">${r.title}</div>
    <div class="big">${r.score.correct} / ${r.score.total}</div><div>${pct}% correct</div>`;
  Object.keys(r.score.bySub).forEach(k=>{
    const s=r.score.bySub[k]; const p=Math.round(100*s.c/s.n);
    html += `<div class="barrow"><div class="lbl">${SLABEL[k]||k}</div>
      <div class="track"><div class="fill" style="width:${p}%"></div></div><div>${s.c}/${s.n}</div></div>`;
  });
  html += `</div>`;
  r.questions.forEach((q,i)=>{
    const yours=r.answers[i]; let ok = q.o ? (yours===q.a) : ((yours||"").toString().trim()===q.a.toString().trim());
    html += `<div class="qcard"><div class="qnum">QUESTION ${i+1}<span class="status ${ok?'correct':'incorrect'}">${ok?'CORRECT':'INCORRECT'}</span></div>
      <div class="qtext">${q.q}</div>`;
    if(q.o){
      html += `<div class="opts">`;
      q.o.forEach((opt,oi)=>{
        let cls="opt"; if(oi===q.a) cls+=" correct"; else if(oi===yours && !ok) cls+=" incorrect";
        html += `<div class="${cls}">${opt}${oi===q.a?' — correct answer':(oi===yours?' — your answer':'')}</div>`;
      });
      html += `</div>`;
    } else { html += `<p>Your answer: <strong>${yours||'(blank)'}</strong> · Correct answer: <strong>${q.a}</strong></p>`; }
    html += `<button class="explbtn" onclick="toggleExpl(${i})">Show explanation</button><div class="expl" id="expl${i}">${q.e}</div></div>`;
  });
  html += `<div class="btnbar"><button class="btn" onclick="finishResults()">Done</button></div>`;
  return html;
}
function toggleExpl(i){ document.getElementById("expl"+i).classList.toggle("show"); }
function finishResults(){
  S.runner=null; S.view = S.mode==="parent" ? "parent-home" : "dashboard";
  S.b=null;S.t=null;S.sub=null;S.browseData=null; render();
}

/* ---------- PROGRESS (student history) ---------- */
function progressHTML(){
  const st=currentStudent();
  let html = `<div class="crumb"><a onclick="goHome()">Dashboard</a> / My history</div>
  <div class="panel"><h2>Practice &amp; test history</h2>`;
  if(st.history.length===0) html += `<p class="note">No sessions yet — start with the learning path!</p>`;
  else{
    html += `<table class="hist"><tr><th>Date</th><th>Session</th><th>Type</th><th>Score</th></tr>`;
    st.history.slice(0,50).forEach(h=>{
      html += `<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.title}</td><td>${h.kind}</td><td>${h.correct}/${h.total}</td></tr>`;
    });
    html += `</table>`;
  }
  html += `</div>`;
  return html;
}

/* ---------- LEADERBOARD ---------- */
function leaderboardHTML(){
  let html = `<div class="crumb"><a onclick="goHome()">Dashboard</a> / Leaderboard</div>
  <div class="panel"><h2>Leaderboard</h2>
  <p class="note">Ranked by lessons completed and streak — not by test scores, so everyone's progress counts.</p></div>`;
  const rows = Object.values(APP.students).map(st=>({
    st, completion: programCompletionCount(st), streak: st.streak.current||0,
    badges: computeBadges(st).filter(b=>b.earned).length
  })).sort((a,b)=> (b.completion-a.completion) || (b.streak-a.streak));
  html += `<table class="lb"><tr><th></th><th>Name</th><th>Progress</th><th>Streak</th><th>Badges</th></tr>`;
  rows.forEach((r,i)=>{
    html += `<tr><td>${i+1}</td><td><span class="av-sm">${r.st.avatar}</span>${r.st.name}</td>
      <td>${r.completion}/70</td><td>🔥${r.streak}</td><td>★${r.badges}</td></tr>`;
  });
  html += `</table>`;
  return html;
}

/* ---------- PARENT AREA ---------- */
function parentGateHTML(){
  return `<div class="pingate"><h2>Parent access</h2>
    <p class="note">Enter the 4-digit parent PIN to manage students and run mock tests. Default is 1234.</p>
    <input id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••">
    <div id="pinErr" class="warn" style="display:none;">Incorrect PIN.</div>
    <button class="btn forest" onclick="tryPin()">Unlock</button></div>`;
}
function tryPin(){
  const v=document.getElementById("pinInput").value.trim();
  if(v===APP.pin){ S.parentUnlocked=true; S.view="parent-home"; render(); }
  else document.getElementById("pinErr").style.display="block";
}
function parentHomeHTML(){
  let html = `<div class="crumb">Parent area (unlocked)</div>
  <div class="panel"><h2>All students</h2>`;
  const list=Object.values(APP.students);
  if(list.length===0) html += `<p class="note">No students yet — add one from the roster manager below.</p>`;
  else{
    html += `<table class="hist"><tr><th>Name</th><th>Progress</th><th>Streak</th><th>Badges</th><th>Last active</th></tr>`;
    list.forEach(st=>{
      const last = st.history[0] ? new Date(st.history[0].date).toLocaleDateString() : "—";
      html += `<tr><td>${st.avatar} ${st.name}</td><td>${programCompletionCount(st)}/70</td>
        <td>🔥${st.streak.current||0}</td><td>★${computeBadges(st).filter(b=>b.earned).length}</td><td>${last}</td></tr>`;
    });
    html += `</table>`;
  }
  html += `</div>
  <div class="panel"><h2>Mock tests</h2>
  <p class="note">Pick a student, set the timer, and start. Questions are randomly drawn fresh each time (${MOCK_PER_SUB} per subtest, 45 total) — hand the device over, it auto-submits at zero.</p>`;
  MOCK_DEFS.forEach(m=>{
    html += `<div class="lockrow"><div><span class="name">${m.title}</span><div class="meta">${m.note}</div></div>
      <button class="btn forest" ${list.length?'':'disabled'} onclick="openMockConfig(${m.id})">Configure &amp; start</button></div>`;
  });
  html += `</div>
  <div class="panel"><h2>Settings</h2><div class="btnbar">
    <button class="btn secondary" onclick="S.view='parent-history';render();">Mock history</button>
    <button class="btn secondary" onclick="S.view='parent-roster';render();">Manage roster</button>
    <button class="btn secondary" onclick="changePin()">Change PIN</button>
    <button class="btn secondary" onclick="S.mode='student';S.parentUnlocked=false;S.view=CUR?'dashboard':'roster';render();">Lock &amp; exit</button>
  </div></div>`;
  return html;
}
function changePin(){
  showPrompt("Enter a new 4-digit PIN:", (val)=>{
    if(val && /^\d{4}$/.test(val)){ APP.pin=val; saveApp(); showAlert("PIN updated."); }
    else{ showAlert("PIN must be exactly 4 digits."); }
  }, APP.pin);
}
function parentRosterHTML(){
  let html = `<div class="crumb"><a onclick="S.view='parent-home';render();">Parent area</a> / Manage roster</div>
  <div class="panel"><h2>Students</h2>`;
  Object.values(APP.students).forEach(st=>{
    html += `<div class="lockrow"><div><span class="name">${st.avatar} ${st.name}</span>
      <div class="meta">Joined ${new Date(st.createdAt).toLocaleDateString()} · ${st.history.length} sessions logged</div></div>
      <button class="btn clay" onclick="confirmRemove('${st.id}')">Remove</button></div>`;
  });
  html += `</div><div class="panel"><h3>Add a student</h3>
    <input class="nameinput" id="parentNewName" placeholder="First name">
    <div class="avatarpick">`;
  AVATARS.forEach(em=>{ html += `<div class="em ${S.newAvatar===em?'sel':''}" onclick="S.newAvatar='${em}';render();">${em}</div>`; });
  html += `</div><button class="btn forest" onclick="parentAddStudent()">Add</button></div>`;
  return html;
}
function confirmRemove(id){
  const st=APP.students[id];
  showConfirm("Remove "+st.name+" and all their progress? This can't be undone.", ()=>{ removeStudent(id); render(); });
}
function parentAddStudent(){
  const name=document.getElementById("parentNewName").value.trim();
  if(!name){ showAlert("Enter a name first."); return; }
  addStudent(name, S.newAvatar); render();
}
function openMockConfig(id){ S.mockConfigId=id; S.mockStudentId=Object.keys(APP.students)[0]||null; S.view="mock-config"; render(); }
function mockConfigHTML(){
  const m=MOCK_DEFS.find(x=>x.id===S.mockConfigId);
  const totalQ = 9*MOCK_PER_SUB;
  const students=Object.values(APP.students);
  return `<div class="crumb"><a onclick="S.view='parent-home';render();">Parent area</a> / ${m.title}</div>
  <div class="panel"><h2>${m.title}</h2><p class="note">${totalQ} questions, randomly drawn across all 9 subtests at Tier ${m.tier}. ${m.note}</p>
  <label>Student:
    <select id="mockStudent" onchange="S.mockStudentId=this.value;">
      ${students.map(s=>`<option value="${s.id}" ${S.mockStudentId===s.id?'selected':''}>${s.avatar} ${s.name}</option>`).join("")}
    </select>
  </label><br><br>
  <label>Timer (minutes, 0 = untimed): <input class="mininput" id="mockMinutes" type="number" min="0" value="${m.suggested}"></label>
  <div class="btnbar">
    <button class="btn clay" onclick="launchMock(${m.id})">Start mock test now</button>
    <button class="btn secondary" onclick="S.view='parent-home';render();">Cancel</button>
  </div></div>`;
}
function launchMock(id){
  const m=MOCK_DEFS.find(x=>x.id===id);
  const mins=parseInt(document.getElementById("mockMinutes").value,10)||0;
  const studentId=document.getElementById("mockStudent").value;
  CUR=studentId;
  const qs=collectMock(m.tier);
  startRunner(m.title, qs, {timerSec:mins>0?mins*60:0, isMock:true, kind:"mock"});
}
function parentHistoryHTML(){
  let html = `<div class="crumb"><a onclick="S.view='parent-home';render();">Parent area</a> / Mock history</div>
  <div class="panel"><h2>Mock test history</h2>`;
  const rows=[];
  Object.values(APP.students).forEach(st=>{
    st.history.filter(h=>h.kind==="mock").forEach(h=>rows.push({name:st.name, avatar:st.avatar, ...h}));
  });
  rows.sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(rows.length===0) html += `<p class="note">No mock tests taken yet.</p>`;
  else{
    html += `<table class="hist"><tr><th>Date</th><th>Student</th><th>Test</th><th>Score</th><th>%</th></tr>`;
    rows.forEach(r=>{
      html += `<tr><td>${new Date(r.date).toLocaleDateString()}</td><td>${r.avatar} ${r.name}</td><td>${r.title}</td>
        <td>${r.correct}/${r.total}</td><td>${Math.round(100*r.correct/r.total)}%</td></tr>`;
    });
    html += `</table>`;
  }
  html += `</div>`;
  return html;
}

  APP = await loadApp();
  render();

  window.DRILLS=DRILLS; window.BSUB=BSUB; window.MOCK_DEFS=MOCK_DEFS;
  window.sampleQuestions=sampleQuestions; window.collectQuestions=collectQuestions;
} // debug mirror
</script>
