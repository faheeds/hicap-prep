}
function confirmRemove(id){
  const st=APP.students[id];
  showConfirm("Remove "+st.name+" and all their progress? This can't be undone.", ()=>{ removeStudent(id); render(); });
}
function parentAddStudent(){
  const name=document.getElementById("parentNewName").value.trim();
  if(!name){ showAlert("Enter a name first."); return; }
  addStudent(name, S.newAvatar, S.newGrade); render();
}
function openMockConfig(id){
  S.mockConfigId=id;
  S.mockStudentId = Object.keys(APP.students)[0] || null;
  S.view="mock-config";
  render();
}
function mockConfigHTML(){
  const m = MOCK_DEFS.find(x => x.id === S.mockConfigId);
  const totalQ = 9 * MOCK_PER_SUB;
  const students = Object.values(APP.students);
  const studentButtons = students.map(s=>`<button type="button" class="${S.mockStudentId===s.id?"sel":""}" onclick="S.mockStudentId='${s.id}';render();">${s.name.split(/\s+/)[0]}</button>`).join("");
  return `${parentHeaderHTML(m.title, "Parent area · mock test")}
  <div class="view" style="padding:var(--space-4); gap:var(--space-4);">
    <div class="mock-panel">
      <div>
        <div class="subhead">${m.title}</div>
        <div class="small tnum" style="color:var(--neutral-700);">${totalQ} questions · Tier ${m.tier} · all three strands</div>
      </div>
      <div class="note">${m.note}</div>
      <div class="field">
        <label>Who is sitting it?</label>
        <div class="segmented">${studentButtons}</div>
      </div>
      <div class="field" style="max-width:220px;">
        <label>Timer (minutes, 0 = untimed)</label>
        <input class="input tnum" id="mockMinutes" type="number" min="0" value="${m.suggested}">
        <span id="mockStudent" data-cur="${S.mockStudentId||""}" class="sr-only"></span>
      </div>
      <div class="row-actions">
        <button class="btn btn-primary btn-cta" onclick="launchMock(${m.id})">Start the timer</button>
        <button class="btn btn-ghost" onclick="S.view='parent-home';render();">Cancel</button>
      </div>
      <div class="note">Hand the device over once the timer starts. It keeps running if the screen sleeps, and the test auto-submits at zero.</div>
    </div>
  </div>`;
}
function launchMock(id){
  const m = MOCK_DEFS.find(x => x.id === id);
  const mins = parseInt(document.getElementById("mockMinutes").value, 10) || 0;
  // The design uses a segmented control (buttons -> S.mockStudentId), but
  // the existing test suite still writes to a `#mockStudent` element's value
  // and reads it here. Preserve both paths.
  const studentEl = document.getElementById("mockStudent");
  const studentId = (studentEl && studentEl.value) || S.mockStudentId || Object.keys(APP.students)[0];
  CUR = studentId;
  const qs = collectMock(m.tier);
  startRunner(m.title, qs, {timerSec: mins>0 ? mins*60 : 0, isMock: true, kind:"mock"});
}
function parentHistoryHTML(){
  const rows = [];
  Object.values(APP.students).forEach(st=>{
    (st.history||[]).filter(h => h.kind === "mock").forEach(h => rows.push({name: st.name, ...h}));
  });
  rows.sort((a,b) => new Date(b.date) - new Date(a.date));
  const table = rows.length === 0
    ? `<p class="note">No mock tests taken yet.</p>`
    : `<table class="ptable"><thead><tr>
        <th>Date</th><th>Student</th><th>Test</th><th class="num">Score</th><th class="num">%</th>
      </tr></thead><tbody>${rows.map(r=>`<tr>
        <td class="tnum">${new Date(r.date).toLocaleDateString()}</td>
        <td class="ellipsis">${r.name}</td>
        <td class="ellipsis">${r.title}</td>
        <td class="num">${r.correct}/${r.total}</td>
        <td class="num">${Math.round(100*r.correct/r.total)}%</td>
      </tr>`).join("")}</tbody></table>`;
  return `${parentHeaderHTML("Mock history","Parent area · history")}
  <div class="view" style="padding:var(--space-4); gap:var(--space-4);">
    ${table}
    <button class="btn btn-ghost" onclick="S.view='parent-home';render();">${ICON("chevron-left",{size:16})}Back to parent area</button>
  </div>`;
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  if(AUTH){
    try{ await AUTH.init(); }catch(e){ console.error("auth init failed", e); }
    // Reload the family's data whenever the session changes. Without this,
    // signing in after boot leaves APP stuck on defaultApp() — which means
    // no consent, no students, no PIN hash. Signing out resets to a clean
    // defaultApp() so the next signed-in user doesn't inherit any state.
    AUTH.onChange(async (session)=>{
      if(session){ APP = await loadApp(); }
      else { APP = defaultApp(); CUR = null; }
      render();
    });
  }
  APP = await loadApp();
  render();
})();

if(typeof window!=="undefined"){
  window.DRILLS=DRILLS; window.BSUB=BSUB; window.MOCK_DEFS=MOCK_DEFS;
  window.sampleQuestions=sampleQuestions; window.collectQuestions=collectQuestions;
} // debug mirror
</script>
