# Supabase local dev config for HiCap Prep.
# Run `npx supabase start` to boot Postgres + Auth locally.
# Run `npx supabase link --project-ref <ref>` to attach a hosted project.

project_id = "hicap-prep"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5500"
additional_redirect_urls = ["https://127.0.0.1:5500"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Magic-link and password sign-in are both enabled by default; the app
# uses `signInWithOtp` for magic link and `signInWithPassword` for
# email + password. Confirmations off in local dev only.

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
