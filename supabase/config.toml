# Supabase local dev config for HiCap Prep.
# Run `npx supabase start` to boot Postgres + Auth locally.
# Run `npx supabase link --project-ref <ref>` to attach a hosted project.

project_id = "hicap-prep"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true

[auth]
enabled = true
site_url = "https://hicapprep.com"
additional_redirect_urls = ["https://hicapprep.com", "https://hicap-prep.vercel.app", "http://127.0.0.1:5500", "https://127.0.0.1:5500"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
# Magic-link and password sign-in are both enabled by default; the app
# uses `signInWithOtp` for magic link and `signInWithPassword` for
# email + password. Confirmations off in local dev only.

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
